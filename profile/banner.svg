<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Nexum — self-sovereign Ethereum tooling">
  <style>
    .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
    .fg { fill: #d6d6cf; }
    .acc { fill: #a8d68a; }
    .mid { fill: #9aa19a; }
    .dim { fill: #6f7570; }
  </style>
  <rect width="1280" height="320" fill="#0a0b0a"/>

  <!-- corner brackets -->
  <g stroke="#5e7c4e" stroke-width="1" fill="none">
    <path d="M24 24 L24 56 M24 24 L56 24"/>
    <path d="M1256 24 L1256 56 M1256 24 L1224 24"/>
    <path d="M24 296 L24 264 M24 296 L56 296"/>
    <path d="M1256 296 L1256 264 M1256 296 L1224 296"/>
  </g>

  <!-- top-left mark: dot + NEXUM + divider + github path -->
  <circle cx="74" cy="60" r="5" class="acc"/>
  <text x="92" y="65" class="mono fg" font-size="16" font-weight="600" letter-spacing="3.2">NEXUM</text>
  <line x1="160" y1="48" x2="160" y2="72" stroke="#1f221f" stroke-width="1"/>
  <text x="172" y="65" class="mono dim" font-size="11" letter-spacing="1.4">github.com/nxm-rs</text>

  <!-- eyebrow -->
  <text x="74" y="142" class="mono acc" font-size="13" letter-spacing="2.4">AGPL-3.0 · NO TOKEN · NO TELEMETRY · SOURCE BEFORE BINARIES</text>

  <!-- headline -->
  <text x="74" y="200" class="mono fg" font-size="52" font-weight="500" letter-spacing="-1.5">Self-sovereign mobile</text>
  <text x="74" y="246" class="mono fg" font-size="52" font-weight="500" letter-spacing="-1.5">wallet. <tspan class="acc">Source available.</tspan></text>

  <!-- bottom spec strip -->
  <g class="mono" font-size="11" letter-spacing="0.9">
    <text x="74" y="292" class="mid"><tspan class="acc">⌬</tspan> wallet · mobile core</text>
    <text x="320" y="292" class="mid"><tspan class="acc">◉</tspan> helios · light client</text>
    <text x="566" y="292" class="mid"><tspan class="acc">◆</tspan> vertex · swarm node</text>
    <text x="812" y="292" class="mid"><tspan class="acc">⊟</tspan> keycard · hardware signing</text>
  </g>

  <!-- right status pill -->
  <text x="1206" y="65" class="mono acc" font-size="11" letter-spacing="1.6" text-anchor="end">PRE-RELEASE</text>
</svg>
